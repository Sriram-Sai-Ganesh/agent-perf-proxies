[project]
name = "core"
version = "0.0.0"
description = "Shared package: row schemas, trajectory store, provenance, model client, scaffolds, episode runner, probe builders"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=17",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.14"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
