# Baseline B2: dev tasks of the long task types, cut off after 20 steps.
# Needs a vLLM endpoint (serve/server.py writes endpoint.json).
run_id: b2_sw_cutoff
env: {name: scienceworld, settings: {simplification: easy, step_limit: 100}}
tasks: $DATA_ROOT/catalogs/scienceworld_dev_gold_scores.parquet  # dev tasks with the gold path's score after each step
suite:
  split: dev
  task_types:  # the task types that have long test tasks
    - boil
    - change-the-state-of-matter-of
    - chemistry-mix
    - chemistry-mix-paint-tertiary-color
    - freeze
    - grow-fruit
    - grow-plant
    - identify-life-stages-1
    - inclined-plane-determine-angle
    - inclined-plane-friction-named-surfaces
    - inclined-plane-friction-unnamed-surfaces
    - measure-melting-point-known-substance
    - measure-melting-point-unknown-substance
    - melt
    - mendelian-genetics-known-plant
    - mendelian-genetics-unknown-plant
    - power-component-renewable-vs-nonrenewable-energy
    - test-conductivity
    - test-conductivity-of-unknown-substances
  ref_step: 15  # keep tasks whose gold path scores at least min_ref_score after this many steps
  min_ref_score: 0.1
  cap_per_type: 8
  seed: 0
agents: [granite-4.1-8b/none/react]
endpoint: {file: $DATA_ROOT/serve/granite-4.1-8b/endpoint.json}
seeds: [0]
max_steps: 20  # the agent is stopped after this many steps
sampling: {temperature: 0.0, max_tokens: 256}
scaffold: {window: 40}
workers: 16
