# Baseline B2, original definition, kept for comparison: dev tasks with a gold path of at most 10 steps, cut off after
# 20 steps. These tasks come from task types that have no long tasks.
# Needs a vLLM endpoint (serve/server.py writes endpoint.json).
run_id: b2_sw_short_plain
env: {name: scienceworld, settings: {simplification: easy, step_limit: 100}}
tasks: $DATA_ROOT/catalogs/scienceworld_dev_gold_scores.parquet  # dev tasks with the gold path's score after each step
suite: {split: dev, max_gold: 10, cap_per_type: 8, seed: 0}
agents: [granite-4.1-8b/none/react]
endpoint: {file: $DATA_ROOT/serve/granite-4.1-8b/endpoint.json}
seeds: [0]
max_steps: 20  # the agent is stopped after this many steps
sampling: {temperature: 0.0, max_tokens: 256}
scaffold: {window: 40}
workers: 16
