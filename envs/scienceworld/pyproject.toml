[project]
name = "env-scienceworld"
version = "0.0.0"
description = "ScienceWorld adapter: a bundled JRE plus the scienceworld package, with the shared core package"
requires-python = ">=3.12"
dependencies = [
    "scienceworld==1.2.3",
    "jdk4py>=21",
    "core",
]

[tool.uv.sources]
core = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["env_scienceworld"]
